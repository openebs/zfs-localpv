name: Registry Login

description: Login to all container registries

inputs:
  docker-user:
    required: false
    default: ""
    type: string
  docker-token:
    required: false
    default: ""
    type: string
  quay-user:
    required: false
    default: ""
    type: string
  quay-token:
    required: false
    default: ""
    type: string
  ghcr-token:
    required: false
    default: ""
    type: string

runs:
  using: composite
  steps:
    - name: Login to Docker Hub
      uses: docker/login-action@v4
      if: ${{ inputs.docker-user && inputs.docker-token }}
      with:
        username: ${{ inputs.docker-user }}
        password: ${{ inputs.docker-token }}

    - name: Login to Quay
      uses: docker/login-action@v4
      if: ${{ inputs.quay-user && inputs.quay-token }}
      with:
        registry: quay.io
        username: ${{ inputs.quay-user }}
        password: ${{ inputs.quay-token }}

    - name: Login to GHCR
      uses: docker/login-action@v4
      if: ${{ inputs.ghcr-token }}
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.ghcr-token }}
