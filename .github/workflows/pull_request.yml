name: Pull Request

on:
  pull_request:
    branches:
      - develop
      - "release/**"
  workflow_call:

jobs:
  preconditions:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.relevant == 'true' || github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            relevant:
              - '**'
              - '!*.md'
              - '!changelogs/**'
              - '!docs/**'
              - '!design/**'
              - '!LICENSE'
              - '!MAINTAINERS'

  lint:
    needs: ["preconditions"]
    if: needs.preconditions.outputs.run == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      validate-codegen: true
      branch-name: ${{ github.event.pull_request.base.ref || ((github.ref_name == 'develop' || startsWith(github.ref_name, 'release/')) && github.ref_name) || '' }}

  csi-driver:
    runs-on: ubuntu-latest
    needs: ["preconditions", "lint"]
    if: needs.preconditions.outputs.run == 'true'
    steps:
      - uses: actions/checkout@v7

  ci:
    if: ${{ success() || needs.preconditions.outputs.run == 'false' }}
    needs:
      - preconditions
      - lint
      - csi-driver
    runs-on: ubuntu-latest
    steps:
      - name: CI succeeded
        run: exit 0
